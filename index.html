<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Validación del Modelo de Gobernanza RSDUE</title>
<style>
:root{
  --navy:#1F3864; --est:#3EA76B; --ope:#29A9C0; --ada:#E8A61E;
  --texto:#1c1c1c; --gris:#666; --linea:#dcdfe4; --fondo:#f4f5f7; --papel:#fff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--texto);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:780px;margin:0 auto;padding:0 14px 90px}
header{background:var(--navy);color:#fff;padding:16px 0 13px}
header .wrap{padding-bottom:0}
header h1{margin:0;font-size:16px;font-weight:600;line-height:1.35}
header .sub{font-size:12.5px;opacity:.85;margin-top:3px}
.sticky{position:sticky;top:0;z-index:20;background:var(--fondo);
  padding:8px 0 6px;border-bottom:1px solid var(--linea)}
.barra{height:6px;background:#e3e6ea;border-radius:3px;overflow:hidden}
.barra>div{height:100%;background:var(--navy);width:0;transition:width .25s}
.progtxt{font-size:12px;color:var(--gris);display:flex;justify-content:space-between;margin-top:4px}
.card{background:var(--papel);border:1px solid var(--linea);border-radius:10px;padding:18px;margin:16px 0}
.card.cond{background:#fbfbfd;border-left:5px solid var(--navy)}
h2{font-size:17px;margin:0 0 10px;color:var(--navy)}
h3{font-size:15px;margin:16px 0 6px;color:var(--navy)}
p{margin:0 0 11px}
.small{font-size:13.5px;color:var(--gris)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;color:#fff;letter-spacing:.02em}
.p-est{background:var(--est)}.p-ope{background:var(--ope)}.p-ada{background:var(--ada)}.p-glo{background:var(--navy)}
/* --- opciones verticales (bloque de pertinencia) --- */
.opts{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.opt{display:flex;align-items:flex-start;gap:10px;border:1.5px solid var(--linea);background:#fff;
  border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left;font-size:15px;line-height:1.35;
  font-family:inherit;color:var(--texto);width:100%}
.opt .num{flex:0 0 25px;height:25px;border-radius:50%;background:#eef0f3;color:var(--gris);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.opt.sel{border-color:var(--navy);background:#eef3fb}
.opt.sel .num{background:var(--navy);color:#fff}
/* --- grilla compacta (bloque de condiciones) --- */
.leyenda{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:10px 0 4px;
  position:sticky;top:52px;background:#fbfbfd;padding:6px 0;z-index:10}
.leyenda span{font-size:10.5px;color:var(--gris);text-align:center;line-height:1.2}
.fila{border-top:1px solid var(--linea);padding-top:11px;margin-top:11px}
.fila:first-of-type{border-top:none}
.fila .nom{font-weight:700;font-size:14.5px;color:var(--navy)}
.fila .txt{font-size:14.5px;margin:3px 0 9px}
.esc{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.esc button{border:1.5px solid var(--linea);background:#fff;border-radius:8px;padding:11px 0;
  font-size:16px;font-weight:700;color:var(--gris);cursor:pointer;font-family:inherit}
.esc button.sel{border-color:var(--navy);background:var(--navy);color:#fff}
/* --- justificación --- */
.just{margin-top:10px;display:none}
.just.on{display:block}
textarea{width:100%;border:1.5px solid var(--linea);border-radius:8px;padding:9px;font-family:inherit;
  font-size:15px;resize:vertical;min-height:66px;background:#fff}
input[type=text]{border:1.5px solid var(--linea);border-radius:8px;padding:9px 11px;font-family:inherit;font-size:15px}
.req{color:#b3261e;font-weight:700}
/* --- navegación --- */
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:18px}
button.b{border:none;border-radius:8px;padding:12px 20px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
.b-pri{background:var(--navy);color:#fff}
.b-sec{background:#e8eaee;color:var(--texto)}
.b-pri:disabled{background:#a9b3c4;cursor:not-allowed}
.b-full{width:100%;margin-bottom:9px}
figure{margin:0 0 10px}
figure img{width:100%;max-width:380px;display:block;margin:0 auto}
figcaption{font-size:12px;color:var(--gris);text-align:center;margin-top:5px}
table.mini{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}
table.mini td{border-bottom:1px solid var(--linea);padding:6px 4px;vertical-align:top}
table.mini td:first-child{font-weight:600;width:36%}
table.res{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0}
table.res td{border-bottom:1px solid var(--linea);padding:6px 4px}
table.res td:last-child{text-align:right;font-weight:700;width:38px}
table.res tr.head td{background:#eef0f3;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
table.res tr.clic{cursor:pointer}
.aviso{background:#fdf6e3;border-left:4px solid var(--ada);padding:10px 12px;border-radius:0 6px 6px 0;font-size:14px;margin:11px 0}
.ok{background:#eef7f0;border-left-color:var(--est)}
.err{background:#fdecea;border-left-color:#b3261e}
.rec{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0 0}
.rec .chip{font-size:11.5px;background:#eef0f3;border:1px solid transparent;border-radius:5px;
  padding:4px 8px;color:var(--gris);font-family:inherit;cursor:help;text-align:left}
.rec .chip:hover{background:#e2e6ec;border-color:#c3c9d2;color:var(--texto)}
.rec .chip.on{background:#eef3fb;border-color:var(--navy);color:var(--navy);font-weight:600}
.chipdef{margin-top:8px;font-size:13.5px;line-height:1.45;background:#f6f8fb;border-left:3px solid var(--navy);
  border-radius:0 6px 6px 0;padding:9px 11px}
code.exp{display:block;background:#f0f2f5;border:1px solid var(--linea);border-radius:6px;padding:9px;
  font-size:11px;word-break:break-all;max-height:130px;overflow:auto;margin:10px 0}
.hide{display:none}
.doc{border:1px solid var(--linea);border-radius:8px;padding:14px;max-height:46vh;overflow-y:auto;background:#fcfcfd}
.firma{margin-top:14px;border-top:2px solid var(--navy);padding-top:14px}
.firma code{font-size:11px}
.kbd{font-size:11.5px;color:#9aa1ab;margin-top:8px}
@media(max-width:420px){ .esc button{padding:12px 0;font-size:15px} .leyenda span{font-size:9.5px} }
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Validación del Modelo de Gobernanza para la transferencia tecnológica de los productos digitales de la RSDUE</h1>
  <div class="sub">Cristóbal Pineda Möller · Tesis de Magíster en Informática Médica · Universidad de Chile</div>
</div></header>

<div class="wrap">
  <div class="sticky" id="stick">
    <div class="barra"><div id="bar"></div></div>
    <div class="progtxt"><span id="ptxt1"></span><span id="ptxt2"></span></div>
  </div>
  <div id="app"></div>
</div>

<script>
"use strict";
/* ======================================================================
   CONFIGURACIÓN — editar antes de distribuir
   ====================================================================== */
const DESTINO = "cristobalpineda@ug.uchile.cl";
const VERSION = "3.7";
/* Codificación de panelistas. La letra inicial define el estrato y con ella
   la versión del instrumento; el número correlativo no tiene tope, de modo que
   el panel puede crecer sin tocar el archivo. Para cambiar las letras, edite
   solo este objeto.  R01, R02, R03…  E01, E02, E03… */
const PREFIJOS = { R:"red", E:"externo" };

/* Normaliza el código a letra + dos dígitos: r3 → R03, E12 → E12. */
function normCod(x){
  const m = String(x || "").trim().toUpperCase().match(/^([A-Z])0*(\d{1,3})$/);
  return m ? m[1] + (m[2].length < 2 ? "0" + m[2] : m[2]) : String(x || "").trim().toUpperCase();
}
/* Estrato a partir de la letra inicial; cadena vacía si el código no es válido. */
function estratoDe(x){
  const c = normCod(x);
  return /^[A-Z]\d{2,3}$/.test(c) ? (PREFIJOS[c[0]] || "") : "";
}

/* ======================================================================
   CONSENTIMIENTO INFORMADO
   ====================================================================== */
const CONS_VER = "1.0";
const CONS = [
 {t:"h1", x:"Documento de consentimiento informado para participación en investigación"},
 {t:"kv", k:"Título del proyecto", x:"Hacia un Modelo de Gobernanza para la Innovación y Transformación en Salud: Construcción desde la Red de Salud Digital de las Universidades del Estado (RSDUE)"},
 {t:"kv", k:"Investigador responsable", x:"Cristóbal Pineda Möller"},
 {t:"kv", k:"Programa", x:"Magíster en Informática Médica, Facultad de Medicina, Universidad de Chile"},
 {t:"kv", k:"Contacto", x:"cristobalpineda@ug.uchile.cl | +569 59320494"},
 {t:"h2", x:"Invitación y objetivo"},
 {t:"p", x:"Usted ha sido invitado/a a participar en esta investigación debido a su experiencia y rol estratégico en la gestión universitaria, el desarrollo tecnológico o la red asistencial de salud pública. El objetivo principal de este estudio es diseñar y validar un modelo de gobernanza que fortalezca la transferencia tecnológica, la sostenibilidad y la adopción de los productos digitales desarrollados por la Red de Salud Digital de las Universidades del Estado (RSDUE), facilitando su integración efectiva en el ecosistema público de salud."},
 {t:"h2", x:"Procedimientos"},
 {t:"p", x:"Si usted acepta participar, su colaboración consistirá en la actividad marcada a continuación, según su rol:"},
 {t:"mod", marc:false, k:"Modalidad A: Entrevista semiestructurada", x:"Participará en una entrevista individual de aproximadamente 45-60 minutos, realizada por videoconferencia. Se abordarán temas relacionados con la gestión de la red, las barreras y desafíos para la adopción de innovaciones en establecimientos de salud, los mecanismos de coordinación entre la academia y los servicios, y las necesidades de transferencia tecnológica hacia el sistema público."},
 {t:"mod", marc:true, k:"Modalidad B: Panel de validación de expertos", x:"Participará en la evaluación del modelo de gobernanza propuesto. Se le enviará un instrumento digital (encuesta) que tomará aproximadamente 30 minutos en responder. Deberá calificar dimensiones como claridad, factibilidad y utilidad del modelo, y podrá agregar comentarios cualitativos para su mejora."},
 {t:"h2", x:"Riesgos y beneficios"},
 {t:"p", x:"Este estudio no implica riesgos físicos ni psicológicos para usted. No existe retribución económica por su participación. El beneficio principal es contribuir a la generación de conocimiento que permita mejorar la gestión de la innovación pública y la transformación digital en el sistema de salud chileno."},
 {t:"h2", x:"Confidencialidad y protección de datos"},
 {t:"p", x:"En cumplimiento con la Ley N°19.628 sobre Protección de la Vida Privada, se implementarán las siguientes medidas:"},
 {t:"li", x:"Anonimización: los datos personales serán disociados de las respuestas mediante codificación alfanumérica. No se registrarán nombres en los reportes finales."},
 {t:"li", x:"Seguridad de la información: las grabaciones y bases de datos se almacenarán en repositorios digitales con acceso exclusivo del equipo investigador."},
 {t:"li", x:"Eliminación: los datos serán eliminados de manera segura tras un periodo de 5 años desde la finalización del estudio."},
 {t:"h2", x:"Voluntariedad"},
 {t:"p", x:"Usted puede rechazar esta invitación o retirarse del estudio en cualquier momento sin sanción ni perjuicio alguno."},
 {t:"h2", x:"Consultas"},
 {t:"p", x:"Si tiene dudas sobre la investigación, puede contactar al investigador responsable."},
 {t:"h2", x:"Declaración de consentimiento"},
 {t:"p", x:"He leído este documento (o se me ha leído) y he tenido la oportunidad de hacer preguntas, las cuales han sido respondidas satisfactoriamente. Comprendo el propósito del estudio, la naturaleza de mi participación y las medidas de confidencialidad. Acepto voluntariamente participar en esta investigación."}
];
function consPlano(){
  return CONS.map(b => b.t === "mod"
    ? "[" + (b.marc ? "X" : " ") + "] " + b.k + ": " + b.x
    : (b.t === "kv" ? b.k + ": " + b.x : (b.t === "li" ? "- " + b.x : b.x))).join("\n");
}

/* ======================================================================
   CONTENIDO
   ====================================================================== */
const COMPONENTES = [
 {id:"A1", amb:"est", n:"C1. Gobernanza en tres niveles",
  d:"Una estructura de decisión con un nivel estratégico-rector que fija políticas y acuerdos, un nivel operativo-coordinador que coordina la ejecución, y un nivel institucional-nodal que implementa en cada universidad."},
 {id:"A2", amb:"est", n:"C2. Núcleo ejecutivo profesionalizado",
  d:"Un equipo remunerado y permanente, con roles definidos, responsable del registro documental de decisiones, acuerdos y versiones, y de la coordinación ejecutiva de las transferencias."},
 {id:"A3", amb:"est", n:"C3. Representación dual con horas protegidas",
  d:"En cada institución, una autoridad institucional y un conector técnico, ambos con horas reconocidas por acto administrativo e integradas a la evaluación académica anual."},
 {id:"A4", amb:"ope", n:"C4. Adopción diferenciada por madurez institucional",
  d:"Una rúbrica de diagnóstico en dimensiones técnica y administrativa asigna a cada institución receptora una vía de adopción rápida o acompañada, reevaluable y sin jerarquía entre receptores."},
 {id:"A5", amb:"ope", n:"C5. Transferencia con acuerdo de nivel de servicio",
  d:"Cada transferencia se formaliza en un acuerdo entre el nivel central y la institución adoptante, con el nivel de servicio graduado por la modalidad del producto y el acompañamiento graduado por la vía de adopción asignada."},
 {id:"A6", amb:"ope", n:"C6. Monitoreo de adopción",
  d:"Seguimiento en tres niveles: uso del producto, arraigo tras el término del acompañamiento, y efectividad respecto del propósito para el cual fue diseñado."},
 {id:"A7", amb:"ope", n:"C7. Vinculación y alianzas",
  d:"Una función formal que opera un catálogo público de productos y una estrategia de alianzas con actores externos."},
 {id:"A8", amb:"ada", n:"C8. Propiedad intelectual y gobernanza de datos",
  d:"Una política que establece la titularidad de cada producto, las condiciones de uso, adaptación y redistribución, y el tratamiento de los datos personales y sensibles de salud conforme a la normativa vigente, reconociendo la autoría individual de los aportes sin ceder la titularidad de red."},
 {id:"A9", amb:"ada", n:"C9. Control de cambios y catálogo único",
  d:"Un registro maestro con titularidad, condiciones de uso, estado de certificación y versiones de cada producto, con cláusula de retorno obligatorio de las mejoras derivadas al catálogo común."},
 {id:"A10", amb:"ada", n:"C10. Financiamiento mutualista",
  d:"Un esquema que combina aporte basal institucionalizado en el presupuesto de cada universidad, prorrateo entre instituciones usuarias y financiamiento externo."}
];

const ESCALA_A = [
 {v:1, t:"No pertinente: no aporta a la transferencia efectiva y sostenible"},
 {v:2, t:"Pertinente solo si se reformula de manera sustantiva"},
 {v:3, t:"Pertinente, requiere ajustes menores"},
 {v:4, t:"Totalmente pertinente en su formulación actual"}
];
const LIK = ["Muy en desacuerdo","En desacuerdo","Ni de acuerdo ni en desacuerdo","De acuerdo","Muy de acuerdo"];

const AMBITOS = [
 {k:"est", nom:"Ámbito Estructural", fn:"Define la distribución de la autoridad: quién decide, quién coordina y quién implementa."},
 {k:"ope", nom:"Ámbito Operacional", fn:"Regula la circulación y la adopción de los productos: cómo un producto llega a una institución y se instala en su operación."},
 {k:"ada", nom:"Ámbito Adaptativo", fn:"Asegura la continuidad del modelo cuando cambian la normativa, la versión del producto y el financiamiento."}
];

/* Cada enunciado tiene dos variantes: "red" para quienes integraron la RSDUE
   y "ext" para actores externos, donde la red opera como caso de ejemplo.
   La variante se resuelve desde la letra inicial del código de panelista. */
const CONDICIONES = [
 {k:"CLA", nom:"Claridad",
  red:"El modelo permite entender qué establece cada componente de este ámbito y a quién corresponde ejecutarlo.",
  ext:"El modelo permite entender qué establece cada componente de este ámbito y a quién corresponde ejecutarlo."},
 {k:"FAC", nom:"Factibilidad",
  red:"El modelo puede implementarse en este ámbito con los recursos y las atribuciones que hoy tienen las universidades del Estado y el nivel central de la red.",
  ext:"El modelo puede implementarse en este ámbito con los recursos y las atribuciones que tiene una red de instituciones que desarrolla productos digitales en salud, como la RSDUE."},
 {k:"UTI", nom:"Utilidad percibida",
  red:"El modelo aporta, en este ámbito, al proceso de transferencia de los productos respecto de la forma en que la red lo realizó.",
  ext:"El modelo aporta, en este ámbito, al proceso de transferencia de productos digitales hacia las instituciones que los adoptan, respecto de la forma en que hoy suele realizarse."},
 {k:"ADA", nom:"Adaptabilidad",
  red:"El modelo permite diagnosticar el estado de este ámbito en distintos momentos y en iniciativas distintas de la red.",
  ext:"El modelo permite diagnosticar el estado de este ámbito en distintos momentos y en iniciativas distintas de aquella que le dio origen."}
];

const GLOBALES = [
 {id:"G_COO", nom:"Coordinación interinstitucional",
  red:"El modelo articula la acción entre las universidades participantes y el nivel central de la red.",
  ext:"El modelo articula la acción entre las instituciones participantes y el nivel central de una red, como ocurre en la RSDUE."},
 {id:"G_SOS", nom:"Sostenibilidad",
  red:"La aplicación del modelo permite generar planes de mejora que hagan sostenible la transferencia de los productos en el tiempo.",
  ext:"La aplicación del modelo permite generar planes de mejora que hagan sostenible la transferencia de los productos en el tiempo."}
];

/* Enunciado del bloque de pertinencia, en sus dos variantes */
const STEM = {
  red:"¿Qué tan pertinente es este componente para lograr una transferencia efectiva y sostenible de los productos digitales de la red hacia el sistema público de salud?",
  ext:"¿Qué tan pertinente es este componente para lograr una transferencia efectiva y sostenible de productos digitales desde una red de instituciones hacia el sistema público de salud, como en el caso de la RSDUE?"
};

/* Resolución de la variante */
function VAR(){ return S.estrato === "externo" ? "ext" : "red"; }
function T(o){ return o[VAR()]; }

const ABIERTAS = [
 {id:"Q1", txt:"¿Qué componente considera más difícil de implementar, y qué condición tendría que cumplirse para que fuera viable?"},
 {id:"Q2", txt:"¿Qué oportunidades de mejora detecta en el modelo?"}
];

/* Claves de ítems en orden fijo — define el orden de columnas del CSV */
const CLAVES = [].concat(
  COMPONENTES.map(c => c.id),
  [].concat.apply([], AMBITOS.map(a => CONDICIONES.map(cd => "B_" + a.k + "_" + cd.k))),
  GLOBALES.map(g => g.id)
);
const TOTAL = CLAVES.length;

/* ======================================================================
   PASOS — componentes de cada ámbito, seguidos de sus condiciones
   ====================================================================== */
const PASOS = [{tipo:"portada"}, {tipo:"modelo"}];
AMBITOS.forEach(a => {
  COMPONENTES.filter(c => c.amb === a.k).forEach(c => PASOS.push({tipo:"itemA", c:c, a:a}));
  PASOS.push({tipo:"cond", a:a});
});
PASOS.push({tipo:"global"});
PASOS.push({tipo:"abiertas"});
PASOS.push({tipo:"resumen"});

/* ======================================================================
   ESTADO
   ====================================================================== */
let S = {codigo:"", estrato:"", cons:null, resp:{}, just:{}, abiertas:{},
         meta:{v:VERSION, inicio:null, tramos:{}, enviado:null}};
let paso = 0;

function claveLS(c){ return "rsdue_oe4_" + (c || S.codigo || "sc"); }
function guardar(){ try{ localStorage.setItem(claveLS(), JSON.stringify(S)); }catch(e){} }
function cargar(cod){
  try{
    const raw = localStorage.getItem(claveLS(cod));
    if(!raw) return false;
    const d = JSON.parse(raw);
    S.resp = d.resp || {}; S.just = d.just || {}; S.abiertas = d.abiertas || {};
    S.cons = d.cons || null; if(d.meta) S.meta = d.meta;
    return Object.keys(S.resp).length > 0;
  }catch(e){ return false; }
}
/* Duración por tramo: primera y última interacción */
function marcar(k){
  const t = S.meta.tramos[k] || (S.meta.tramos[k] = {ini:Date.now(), fin:null});
  t.fin = Date.now();
}
function contestados(){ return CLAVES.filter(k => S.resp[k] !== undefined).length; }
function faltantes(){ return CLAVES.filter(k => S.resp[k] === undefined); }
function justPend(){
  return CLAVES.filter(k => S.resp[k] !== undefined && S.resp[k] <= 2 &&
    !(S.just[k] && S.just[k].trim().length > 2));
}
function nombreItem(k){
  const c = COMPONENTES.find(x => x.id === k); if(c) return c.n;
  const g = GLOBALES.find(x => x.id === k); if(g) return "Modelo completo · " + g.nom;
  const p = k.split("_");
  const a = AMBITOS.find(x => x.k === p[1]), cd = CONDICIONES.find(x => x.k === p[2]);
  return a.nom + " · " + cd.nom;
}
function pasoDe(k){
  for(let i = 1; i < PASOS.length; i++){
    const P = PASOS[i];
    if(P.tipo === "itemA" && P.c.id === k) return i;
    if(P.tipo === "cond" && k.indexOf("B_" + P.a.k) === 0) return i;
    if(P.tipo === "global" && k.indexOf("G_") === 0) return i;
  }
  return 1;
}

/* ======================================================================
   RENDER
   ====================================================================== */
const app = document.getElementById("app");
const esc = s => String(s).replace(/[<>&]/g, m => ({"<":"&lt;",">":"&gt;","&":"&amp;"}[m]));

function progreso(){
  const n = contestados();
  document.getElementById("bar").style.width = Math.round(100 * n / TOTAL) + "%";
  document.getElementById("ptxt1").textContent = paso === 0 ? "" : n + " de " + TOTAL + " respuestas";
  document.getElementById("ptxt2").textContent = paso === 0 ? "" : (n === TOTAL ? "completo" : "");
}

function justHTML(k){
  const v = S.resp[k];
  const req = v !== undefined && v <= 2, sug = v === 3;
  return '<div class="just' + (req || sug ? " on" : "") + '" id="j_' + k + '">' +
    '<p class="small" style="margin:2px 0 5px" id="jl_' + k + '">' +
    (req ? '<span class="req">Requerido:</span> indique brevemente qué habría que corregir.' : 'Comentario opcional.') +
    '</p><textarea data-just="' + k + '" placeholder="Su comentario">' + esc(S.just[k] || "") + '</textarea></div>';
}

function nav(ok, txt){
  return '<div class="nav"><button class="b b-sec" data-nav="-1">Atrás</button>' +
    '<button class="b b-pri" data-nav="1"' + (ok ? "" : " disabled") + ' id="sig">' +
    (txt || "Siguiente") + '</button></div>';
}

      '<figcaption>Cinco principios rectores en el anillo · tres ámbitos equivalentes en los vértices · un objetivo común en el centro: la transferencia efectiva y sostenible de los productos digitales de la red al sistema público de salud.</figcaption></figure>' +
      '<h3>Cómo leer la figura</h3>' +
      '<p class="small"><b>Los vértices del triángulo</b> alojan los tres ámbitos: estructural, operacional y adaptativo. El triángulo equilátero los conecta como componentes interdependientes y equidistantes del centro: cada ámbito se relaciona con los otros dos y ninguno ocupa una posición jerárquica.</p>' +
      '<p class="small"><b>El anillo</b> representa los cinco principios rectores: interoperabilidad, equidad digital, transparencia y rendición de cuentas, gobernanza de datos por diseño y sostenibilidad institucional. Se expresan como un gradiente que permea el interior de la figura, porque operan de manera transversal a los tres ámbitos y no como un nivel superior.</p>' +
      '<p class="small"><b>El centro</b> corresponde al objetivo común: la transferencia efectiva y sostenible de los productos digitales de la red al sistema público de salud.</p>' +
      '<h3>Cómo está organizado</h3>' +
      '<p class="small">Para cada ámbito verá primero sus componentes, uno por pantalla, y calificará la <b>pertinencia</b> de cada uno. Inmediatamente después evaluará <b>cuatro condiciones</b> referidas al conjunto de ese ámbito. Al final, dos condiciones sobre el modelo completo y dos preguntas abiertas. Son <b>' + TOTAL +
      ' calificaciones</b>; toma entre 12 y 15 minutos y puede cerrar y retomar desde el mismo enlace.</p>' +

function pintar(h){ app.innerHTML = h; enlazar(); progreso(); window.scrollTo(0, 0); }
async function huella(txt){
  try{
    const b = new TextEncoder().encode(txt);
    const d = await crypto.subtle.digest("SHA-256", b);
    return Array.from(new Uint8Array(d)).map(x => x.toString(16).padStart(2, "0")).join("");
  }catch(e){
    let x = 0; for(let i = 0; i < txt.length; i++){ x = (x * 31 + txt.charCodeAt(i)) >>> 0; }
    return "nosha-" + x.toString(16);
  }
}
function textoConstancia(){
  const f = S.cons;

    "=====================================\n\n" + consPlano() +

    "Versión del documento   : " + f.ver + "\n" +
    "Huella SHA-256          : " + f.huella + "\n" +
    "Navegador               : " + f.ua + "\n\n" +
    "La huella se calcula sobre el texto íntegro del documento, el nombre, el código y la marca temporal. " +
    "Cualquier modificación posterior de alguno de esos elementos produce una huella distinta.\n";
}

/* ---------- actualización puntual: no redibuja, no mueve el scroll ---------- */
function elegir(k, v){
  S.resp[k] = v;
  const P = PASOS[paso];
  marcar(P.tipo + (P.a ? "_" + P.a.k : ""));
  guardar();

  const grupo = document.querySelector('[data-grupo="' + k + '"]');
  if(grupo) grupo.querySelectorAll("button").forEach(b => {
    b.classList.toggle("sel", parseInt(b.dataset.v, 10) === v);
  });

  const j = document.getElementById("j_" + k), lab = document.getElementById("jl_" + k);
  if(j){
    const req = v <= 2, sug = v === 3;
    j.classList.toggle("on", req || sug);
    if(lab) lab.innerHTML = req
      ? '<span class="req">Requerido:</span> indique brevemente qué habría que corregir.'
      : 'Comentario opcional.';
  }
  const sig = document.getElementById("sig");
  if(sig){
    let ok = false;
    if(P.tipo === "itemA") ok = S.resp[P.c.id] !== undefined;
    else if(P.tipo === "cond") ok = CONDICIONES.every(cd => S.resp["B_" + P.a.k + "_" + cd.k] !== undefined);
    else if(P.tipo === "global") ok = GLOBALES.every(g => S.resp[g.id] !== undefined);
    sig.disabled = !ok;
  }
  progreso();
}

function enlazar(){
  app.querySelectorAll("[data-k]").forEach(b => {
    b.onclick = () => elegir(b.dataset.k, parseInt(b.dataset.v, 10));
  });
  app.querySelectorAll("textarea[data-just]").forEach(t => {
    t.oninput = () => { S.just[t.dataset.just] = t.value; guardar(); };
  });
  app.querySelectorAll("textarea[data-abierta]").forEach(t => {
    t.oninput = () => { S.abiertas[t.dataset.abierta] = t.value; guardar(); };
  });
  app.querySelectorAll("[data-comp]").forEach(b => {
    b.onclick = () => {
      const c = COMPONENTES.find(x => x.id === b.dataset.comp);
      const box = document.getElementById("chipDef");
      const abierto = b.classList.contains("on");
      app.querySelectorAll("[data-comp]").forEach(x => x.classList.remove("on"));
      if(abierto){ box.classList.add("hide"); return; }
      b.classList.add("on");
      box.innerHTML = "<b>" + c.n + ".</b> " + c.d;
      box.classList.remove("hide");
    };
  });
  app.querySelectorAll("[data-nav]").forEach(b => {
    b.onclick = () => {
      const d = parseInt(b.dataset.nav, 10);
      if(paso + d >= 0 && paso + d < PASOS.length){ paso += d; render(); }
    };
  });
  app.querySelectorAll("[data-ir]").forEach(b => {
    b.onclick = () => { paso = pasoDe(b.dataset.ir); render(); };
  });

  const cod = document.getElementById("cod");
  if(cod) cod.oninput = () => {
    S.codigo = normCod(cod.value);
    S.estrato = estratoDe(S.codigo);
    const m = document.getElementById("codMsg");
    if(m) m.innerHTML = msgCodigo();
  };
  const vc = document.getElementById("verCons");
  if(vc) vc.onclick = () => { document.getElementById("docCons").classList.toggle("hide"); };
  const bc = document.getElementById("bajarCons");
  if(bc) bc.onclick = () => bajar("RSDUE_Consentimiento_" + S.cons.cod + ".txt", textoConstancia(), "text/plain");
  const fb = document.getElementById("firmar");
  if(fb) fb.onclick = async () => {
    const nom = document.getElementById("nom").value.trim();
    const ac = document.getElementById("acep").checked;
    const est = document.getElementById("firmaEstado");
    if(!estratoDe(S.codigo)){ est.innerHTML = '<span class="req">Ingrese un código de panelista válido antes de firmar.</span>'; return; }
    if(nom.length < 5){ est.innerHTML = '<span class="req">Escriba su nombre completo.</span>'; return; }
    if(!ac){ est.innerHTML = '<span class="req">Marque la casilla de aceptación para continuar.</span>'; return; }
    const cod0 = S.codigo, est0 = S.estrato;
    cargar(cod0); S.codigo = cod0; S.estrato = est0;
    if(!S.meta.inicio) S.meta.inicio = Date.now();
    const fecha = new Date().toISOString();
    const base = CONS_VER + "|" + nom + "|" + S.codigo + "|" + fecha + "|" + consPlano();
    S.cons = {nombre:nom, cod:S.codigo, fecha:fecha, ver:CONS_VER,
              huella: await huella(base), ua: navigator.userAgent};
    guardar(); paso++; render();
  };
  const m = document.getElementById("mail"); if(m) m.onclick = enviarCorreo;
  const c = document.getElementById("copiar"); if(c) c.onclick = (ev) => { ev.preventDefault(); copiar(); };
  const d = document.getElementById("bajar"); if(d) d.onclick = descargar;
}

/* Teclas 1–4 en las pantallas de un solo ítem */
document.addEventListener("keydown", e => {

   EXPORTACIÓN

function payload(){
  S.meta.enviado = Date.now();
  S.estrato = estratoDe(S.codigo) || S.estrato || "";
  guardar();
  const c = S.cons;
  return {inst:"RSDUE-OE4", v:VERSION, cod:S.codigo, estrato:S.estrato,
          // el nombre NO viaja con las respuestas: queda solo en la constancia
          consentimiento: c ? {aceptado:true, fecha:c.fecha, ver:c.ver, huella:c.huella} : null,
          resp:S.resp, just:S.just, abiertas:S.abiertas, meta:S.meta};
}
function compacta(p){
  return "RSDUE-OE4|v" + VERSION + "|" + p.cod + "|" + (p.estrato || "?") + "|" +
         CLAVES.map(k => p.resp[k]).join("");
}
function textoPlano(p){
  return cuerpoBreve(p, true);
}
/* CSV de columnas fijas: los seis archivos se apilan sin ajustes */
function csv(p){
  const cols = ["codigo","estrato","version","enviado","consent_fecha","consent_huella"];
  const vals = [p.cod, p.estrato, p.v, new Date(p.meta.enviado).toISOString(),
                p.consentimiento ? p.consentimiento.fecha : "",
                p.consentimiento ? p.consentimiento.huella : ""];
  CLAVES.forEach(k => { cols.push(k); vals.push(p.resp[k] === undefined ? "" : p.resp[k]); });
  CLAVES.forEach(k => { cols.push("J_" + k); vals.push(txt(p.just[k])); });
  ABIERTAS.forEach(q => { cols.push(q.id); vals.push(txt(p.abiertas[q.id])); });
  return cols.join(";") + "\n" + vals.join(";");
}
function txt(s){ return '"' + String(s || "").replace(/"/g, '""').replace(/\r?\n/g, " ") + '"'; }

function archivos(p){
  const nom = "RSDUE_OE4_" + (p.cod || "SC");
  const fs = [
    new File(["\ufeff" + csv(p)], nom + ".csv", {type:"text/csv"}),
    new File([JSON.stringify(p, null, 1)], nom + ".json", {type:"application/json"})
  ];
  if(S.cons) fs.push(new File(["\ufeff" + textoConstancia()],
    "RSDUE_Consentimiento_" + p.cod + ".txt", {type:"text/plain"}));
  return fs;
}
function cuerpoBreve(p, conJSON){
  let t = "Estimado Cristóbal:\n\nSe remiten mis respuestas al instrumento de validación del Modelo de " +
    "Gobernanza de la RSDUE (panelista " + p.cod + "). Se adjuntan los archivos en formato CSV y JSON" +
    (S.cons ? ", junto con la constancia de consentimiento informado" : "") + ".\n\nSaluda atentamente.\n";
  t += "\n----------------------------------------\nRespaldo de calificaciones: " + compacta(p) + "\n";
  if(conJSON) t += "\n--- JSON completo (no modificar) ---\n" + JSON.stringify(p) + "\n";
  return t;
}
async function enviarCorreo(){
  const p = payload(), est = document.getElementById("estado");
  const fs = archivos(p);

  // 1) Teléfono: hoja de compartir del sistema, con los archivos adjuntos de verdad
  try{
    if(navigator.canShare && navigator.canShare({files:fs})){
      await navigator.share({
        files: fs,
        title: "Validación OE4 — panelista " + p.cod,
        text: cuerpoBreve(p, true)
      });
      est.innerHTML = "Se abrió el menú para compartir con los dos archivos adjuntos. " +
        "Elija su aplicación de correo, verifique que el destinatario sea <b>" + DESTINO + "</b> y envíe.";
      return;
    }
  }catch(e){
    if(e && e.name === "AbortError"){ est.innerHTML = "Envío cancelado. Puede intentarlo de nuevo."; return; }
  }

  // 2) Escritorio: descarga de los archivos y tres formas de redactar el correo.
  //    Ningún correo se abre por script (los navegadores lo bloquean): se
  //    presentan enlaces que el panelista pulsa directamente.
  bajar(fs[0].name, "\ufeff" + csv(p), "text/csv");
  setTimeout(() => bajar(fs[1].name, JSON.stringify(p, null, 1), "application/json"), 350);
  if(fs[2]) setTimeout(() => bajar(fs[2].name, "\ufeff" + textoConstancia(), "text/plain"), 700);

  const asunto = "Validación OE4 — panelista " + p.cod;
  const cuerpoLargo = cuerpoBreve(p, true);
  const cuerpoCorto = cuerpoBreve(p, false);
  // mailto tiene un límite práctico bajo; los webmail admiten cuerpos mucho mayores.
  const cuerpoMailto = ("mailto:" + DESTINO + "?subject=" + encodeURIComponent(asunto) +
    "&body=" + encodeURIComponent(cuerpoLargo)).length < 1900 ? cuerpoLargo : cuerpoCorto;

  const urlMailto = "mailto:" + DESTINO + "?subject=" + encodeURIComponent(asunto) +
    "&body=" + encodeURIComponent(cuerpoMailto);
  const urlGmail = "https://mail.google.com/mail/?view=cm&fs=1&tf=1&to=" + encodeURIComponent(DESTINO) +
    "&su=" + encodeURIComponent(asunto) + "&body=" + encodeURIComponent(cuerpoLargo);
  const urlOutlook = "https://outlook.office.com/mail/deeplink/compose?to=" + encodeURIComponent(DESTINO) +
    "&subject=" + encodeURIComponent(asunto) + "&body=" + encodeURIComponent(cuerpoLargo);

  const boton = (href, txt, ext) =>
    '<a class="b b-sec b-full" style="display:block;text-align:center;text-decoration:none" href="' +
    href.replace(/"/g, "%22") + '"' + (ext ? ' target="_blank" rel="noopener"' : '') + '>' + txt + '</a>';

  const zona = document.getElementById("correoZona");
  zona.innerHTML =
    '<p class="small" style="margin:14px 0 8px"><b>Elija dónde redactar el correo.</b> Se abrirá con el mensaje ya escrito y dirigido a ' +
    DESTINO + '; solo tiene que <b>adjuntar los archivos descargados</b> y enviarlo.</p>' +
    boton(urlGmail, "Redactar en Gmail", true) +
    boton(urlOutlook, "Redactar en Outlook web", true) +
    boton(urlMailto, "Usar el programa de correo del equipo", false) +
    '<p class="small">Si ninguno abre, escriba usted mismo un correo a <b>' + DESTINO +
    '</b> y adjunte los archivos que acaba de descargar: eso basta, no se necesita el texto del mensaje.</p>';
  zona.classList.remove("hide");

  est.innerHTML = "Se descargaron <b>" + fs.map(f => f.name).join("</b>, <b>") + "</b>. " +
    "Búsquelos en la carpeta de descargas de su equipo, porque debe adjuntarlos al correo.";
}
function copiar(){
  const p = payload(), t = textoPlano(p);
  const est = document.getElementById("estado"), box = document.getElementById("cadena");
  const fallback = () => {
    box.textContent = t; box.classList.remove("hide");
    est.innerHTML = "Seleccione el texto de abajo, cópielo y péguelo en un mensaje dirigido a <b>" + DESTINO + "</b>.";
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(t).then(() => {
      est.innerHTML = "Copiado. Pegue el contenido en un correo o mensaje dirigido a <b>" + DESTINO + "</b>.";
    }).catch(fallback);
  } else fallback();
}
function descargar(){
  const p = payload(), nom = "RSDUE_OE4_" + (p.cod || "SC");
  bajar(nom + ".json", JSON.stringify(p, null, 1), "application/json");
  setTimeout(() => bajar(nom + ".csv", csv(p), "text/csv"), 400);
  document.getElementById("estado").innerHTML =
    "Se descargaron <b>" + nom + ".csv</b> y <b>" + nom + ".json</b>. Adjunte ambos en un correo dirigido a <b>" + DESTINO + "</b>.";
}
function bajar(nombre, contenido, mime){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + contenido], {type:mime + ";charset=utf-8"}));
  a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
}

  const hash = (location.hash || "").replace("#", "").trim().toUpperCase();
  if(hash){ S.codigo = normCod(hash); S.estrato = estratoDe(S.codigo); }
  render();
})();
